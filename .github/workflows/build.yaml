name: Update profile cards

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 6"   # weekly, Saturday 04:00 UTC
  workflow_dispatch:        # manual run button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Regenerate stats in the right-panel cards
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python today.py

      # The left portrait WebPs are fixed art, baked locally by
      # tools/warhol/build_warhol.py; the weekly job only refreshes the stats SVGs
      # in assets/.

      - name: Commit updated cards
        run: |-
          git add assets cache
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git commit -m "Update profile stats" -a || echo "No changes to commit"
          git push
